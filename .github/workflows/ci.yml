name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
        include:
          - os: windows-latest
            python-version: "3.11"
          - os: windows-latest
            python-version: "3.13"

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint with ruff
        run: |
          python -m ruff check hydeph tests

      - name: Run test suite with pytest
        run: |
          python -m pytest tests -v --tb=short > pytest_output.log 2>&1 || (cat pytest_output.log && exit 1)
          cat pytest_output.log

      - name: Post failure log to commit comment
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SUMMARY_TEXT=$(tail -n 80 pytest_output.log)
          gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" \
            -f body="### Pytest Failure (${{ matrix.os }}, Python ${{ matrix.python-version }})
          \`\`\`text
          $SUMMARY_TEXT
          \`\`\`" || true
